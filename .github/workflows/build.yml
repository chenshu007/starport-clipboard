name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile with built-in csc.exe (.NET Framework 4.x)
        shell: cmd
        run: build.bat

      - uses: actions/upload-artifact@v4
        with:
          name: FixedClipboard
          path: FixedClipboard.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          7z a FixedClipboard-${GITHUB_REF_NAME}.zip FixedClipboard.exe
          gh release create "$GITHUB_REF_NAME" FixedClipboard.exe "FixedClipboard-${GITHUB_REF_NAME}.zip" \
            --title "Starport 固定剪贴板 $GITHUB_REF_NAME" --generate-notes
