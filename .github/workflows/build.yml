name: build

on:
  push:
    branches: [main]
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile with built-in csc.exe (.NET Framework 4.x)
        shell: cmd
        run: build.bat

      - uses: actions/upload-artifact@v4
        with:
          name: FixedClipboard
          path: FixedClipboard.exe

      - name: Attach exe to release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          7z a "FixedClipboard-$TAG.zip" FixedClipboard.exe
          gh release upload "$TAG" FixedClipboard.exe "FixedClipboard-$TAG.zip" --clobber
