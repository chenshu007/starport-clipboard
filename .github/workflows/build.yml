name: build

on:
  push:
    branches: [main]
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile with built-in csc.exe (.NET Framework 4.x)
        shell: cmd
        run: build.bat

      # 窗口程序没有控制台：结果重定向到文件再打印；全部通过时退出码为 0
      - name: Self-test
        shell: cmd
        timeout-minutes: 3
        run: |
          StarportHaiku.exe --self-test > "%RUNNER_TEMP%\selftest.log" 2>&1
          set RC=%ERRORLEVEL%
          type "%RUNNER_TEMP%\selftest.log"
          exit /b %RC%

      - uses: actions/upload-artifact@v4
        with:
          name: StarportHaiku
          path: StarportHaiku.exe

      - name: Publish release for new VERSION
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(tr -d ' \r\n' < VERSION)"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG 已发布过，跳过（发新版请修改 VERSION）"
            exit 0
          fi
          7z a "StarportHaiku-$TAG.zip" StarportHaiku.exe
          # 同时附上旧文件名 FixedClipboard.exe，旧的固定下载链接也能拿到最新版
          cp StarportHaiku.exe FixedClipboard.exe
          gh release create "$TAG" StarportHaiku.exe "StarportHaiku-$TAG.zip" FixedClipboard.exe \
            --target "$GITHUB_SHA" --title "Starport Haiku $TAG" --generate-notes

      - name: Attach exe to manually created release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          7z a "StarportHaiku-$TAG.zip" StarportHaiku.exe
          cp StarportHaiku.exe FixedClipboard.exe
          gh release upload "$TAG" StarportHaiku.exe "StarportHaiku-$TAG.zip" FixedClipboard.exe --clobber
